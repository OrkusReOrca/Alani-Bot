name: Fortnite Jam Tracks Tracker (Shop) — Post

on:
  # Schedule trigger deactivated — runs in-process on the persistent bot
  # instead. See shop-check.yml and src/common/dailyJobs.js.
  # schedule:
  #   - cron: "12 1 * * *" # ~8:12 AM Indochina Time (UTC+7)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install canvas system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - run: npm install

      - run: npm run post:fortnite-jam-tracks-tracker-shop
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_FORTNITE_CHANNEL_ID: ${{ secrets.DISCORD_FORTNITE_CHANNEL_ID }}

      - name: Clear pending diff, record posted grid image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fortnite-jam-tracks-tracker/shop/pending-diff.json data/fortnite-jam-tracks-tracker/shop/last-grid.json
          git diff --quiet --cached || git commit -m "chore(fortnite-jam-tracks-tracker): clear shop pending diff after posting [skip ci]"
          git push
