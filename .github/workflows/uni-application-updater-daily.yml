name: Uni Application Updater — Daily

on:
  # Schedule trigger deactivated — runs in-process on the persistent bot
  # instead (bot-hosting.net is online 24/7). See
  # src/common/dailyJobs.js. Kept here (commented, not deleted) plus
  # workflow_dispatch below as a manual fallback if ever needed.
  # schedule:
  #   - cron: "19 2 * * *" # ~9:19 AM Indochina Time (UTC+7); this was
  #                        # seen running 48+ min late at the old :00 slot
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install canvas system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - run: npm install

      - run: npm run start:uni-application-updater
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          FORCE_DM: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/uni-application-updater/state.json
          git diff --quiet --cached || git commit -m "chore(uni-application-updater): update state [skip ci]"
          git push
