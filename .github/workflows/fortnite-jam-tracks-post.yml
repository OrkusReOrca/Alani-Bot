name: Fortnite Jam Tracks — Post

on:
  schedule:
    # 8:00 AM Indochina Time (UTC+7) = 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - run: npm run post:fortnite-jam-tracks-updater
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_FORTNITE_CHANNEL_ID: ${{ secrets.DISCORD_FORTNITE_CHANNEL_ID }}

      - name: Clear pending diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fortnite-jam-tracks-updater/pending-diff.json
          git diff --quiet --cached || git commit -m "chore(fortnite-jam-tracks-updater): clear pending diff after posting [skip ci]"
          git push
