name: Fortnite Jam Tracks Tracker (Shop) — Check

on:
  schedule:
    # ~7:37 AM Indochina Time (UTC+7) = 00:37 UTC — off a round minute
    # (avoid :00/:05/:30) since GitHub's scheduler queues those hardest
    # under load; see root README for the delay writeup.
    - cron: "37 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-shop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install canvas system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - run: npm install

      - run: npm run check:fortnite-jam-tracks-tracker-shop

      - name: Commit updated state and pending diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fortnite-jam-tracks-tracker/shop/state.json data/fortnite-jam-tracks-tracker/shop/pending-diff.json
          git diff --quiet --cached || git commit -m "chore(fortnite-jam-tracks-tracker): update shop check [skip ci]"
          git push
